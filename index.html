<style>
/* ===== Tema ===== */
:root{--p:#6D28D9;--dk:#4C1D95;--lt:#EDE9FE;--ac:#A78BFA;--bg:#FAF8FF;--tx:#1F1533;--mut:#6B6280;--line:#E4DBF7;--ok:#16A34A;--bad:#DC2626;--late:#EA580C;--part:#CA8A04}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 500px at 90% -10%,#E3D6FF,transparent),radial-gradient(700px 400px at -10% 100%,#EFE7FF,transparent),var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
a{color:var(--p)}
.app{display:grid;grid-template-columns:240px 1fr}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;background:linear-gradient(180deg,var(--dk),#2E1065);color:#fff;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.brand img{width:38px;height:auto;background:#fff;border-radius:10px;padding:3px}
.side nav{display:flex;flex-direction:column;gap:6px}
.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:12px;background:none;color:#DDD1FF;cursor:pointer;font-weight:500;text-align:left;transition:.2s}
.nv:hover{background:rgba(255,255,255,.1)}
.nv.on{background:#fff;color:var(--dk);font-weight:600}
.nv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px}
.top .brand{display:none;color:var(--dk)}
.srch{flex:1;max-width:380px;margin-left:auto;min-height:44px;color:var(--tx);padding:10px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.8)}
main{padding:4px 28px 100px;max-width:1150px}
h1{font-size:1.6rem;font-weight:800;margin-bottom:18px;letter-spacing:-.02em}
h2{font-size:1.1rem;font-weight:600;margin:26px 0 12px}
.bottom{display:none}
/* ===== Kartlar ===== */
.card{background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border:1px solid rgba(109,40,217,.12);border-radius:16px;box-shadow:0 8px 30px rgba(76,29,149,.08);padding:18px;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid.w{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.st small{color:var(--mut);font-weight:500;display:block;margin-bottom:6px}
.st b{font-size:1.45rem;font-weight:800}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.b{display:inline-block;padding:4px 10px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.b.ok{background:#DCFCE7;color:#166534}.b.late{background:#FFEDD5;color:#9A3412}.b.bad{background:#FEE2E2;color:#991B1B}.b.part{background:#FEF9C3;color:#854D0E}.b.wait{background:#F1F5F9;color:#475569}.b.pur{background:var(--lt);color:var(--dk)}
/* ===== Butonlar ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 20px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--dk));color:#fff;font-weight:600;cursor:pointer;text-decoration:none;transition:.2s}
.btn:hover{filter:brightness(1.12)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.88rem}
.btn.g{background:var(--lt);color:var(--dk)}.btn.r{background:#FEE2E2;color:#991B1B}.btn.wa{background:#DCFCE7;color:#166534}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
/* ===== Müşteri kartı ===== */
.cc h3{font-size:1.1rem}
.cc .r1{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem;align-items:center;flex-wrap:wrap}
.kv>span:first-child{color:var(--mut)}
.kv a{word-break:break-all}
/* ===== Tablolar ===== */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;color:var(--mut);font-weight:500;padding:10px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--line)}
.tbl tfoot td{font-weight:800;background:var(--lt)}
.num{text-align:right;white-space:nowrap}
.act{white-space:nowrap;text-align:right}
.pick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pick input,.pick select,dialog input{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:44px}
.pick select{flex:1;min-width:220px}
.empty{text-align:center;padding:44px 16px;color:var(--mut)}
.empty i{font-style:normal;display:grid;place-items:center;width:72px;height:72px;margin:0 auto 14px;border-radius:24px;background:var(--lt);font-size:2rem}
.empty b{display:block;color:var(--tx);margin-bottom:4px}
.ul li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ul{padding:0}
/* ===== Form (modal / alt çekmece) ===== */
dialog{border:0;border-radius:20px;padding:22px;width:min(480px,94vw);box-shadow:0 30px 80px rgba(31,21,51,.4)}
dialog::backdrop{background:rgba(31,21,51,.5)}
dialog label{display:block;margin-bottom:12px;font-size:.88rem;font-weight:500;color:var(--mut)}
dialog input,dialog select{width:100%;margin-top:4px;color:var(--tx)}
dialog select{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:44px}
dialog h3{margin-bottom:14px}
#err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.on{opacity:1}
.mm{padding:0;margin-bottom:10px}
.mm summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:14px 16px;min-height:52px}
.mm summary::-webkit-details-marker{display:none}
.mm summary::after{content:"▾";margin-left:auto;color:var(--mut);transition:.2s}
.mm[open] summary::after{transform:rotate(180deg)}
.mm .mn{font-weight:600;min-width:130px}
.mm .dl{font-weight:600}.mm .dl.late{color:var(--late)}.mm .dl.bad{color:var(--bad)}
.mm .bd{padding:0 16px 10px}
.lr{display:flex;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lr small{display:block;color:var(--mut);font-size:.82rem}
.la{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;background:var(--lt);font-weight:600}
/* ===== Mobil ===== */
@media(max-width:860px){
 .app{display:block}.side{display:none}
 .top{padding:14px 16px}.top .brand{display:flex}.srch{max-width:none}
 main{padding:4px 16px 110px}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .bottom .nv{flex:1;flex-direction:column;gap:2px;font-size:.72rem;padding:8px 2px;color:var(--mut)}
 .bottom .nv.on{background:var(--lt);color:var(--p)}
 dialog{margin:auto auto 0;width:100vw;max-width:100vw;border-radius:22px 22px 0 0;max-height:92vh}
 .tbl thead{display:none}.tbl,.tbl tbody,.tbl tfoot,.tbl tr{display:block}
 .tbl tr{border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:10px;background:#fff}
 .tbl td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 0;text-align:right}
 .tbl td[data-l]::before{content:attr(data-l);color:var(--mut);text-align:left}
 .tbl tfoot tr{background:var(--lt)}.tbl tfoot td{background:none}
 .act{justify-content:flex-end}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.bottom,.top,.np{display:none!important}.app{display:block}body{background:#fff}.card{box-shadow:none;backdrop-filter:none}}
</style>
</head>

<script>
/* ===== Yardımcılar ===== */
const $=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
tl=n=>n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺',
fd=d=>d?MON[+d.slice(5,7)-1]+' '+d.slice(0,4):'—',
pdate=ym=>{const[y,m]=ym.split('-').map(Number);const r=iso(y,m,Math.min(+today().slice(8),new Date(y,m,0).getDate()));return r>today()?today():r},
md=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7)),
p2=n=>String(n).padStart(2,'0'),
iso=(y,m,d)=>`${y}-${p2(m)}-${p2(d)}`,
MON=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'],
mname=ym=>{const[y,m]=ym.split('-');return MON[m-1]+' '+y},
ml=m=>m.ym[0]=='m'?m.desc:mname(m.ym),
today=()=>{const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())},
dd=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5),
nextDay=d=>new Date(Date.parse(d)+864e5).toISOString().slice(0,10),
uid=()=>Math.random().toString(36).slice(2,9),
url=u=>/^https?:\/\//i.test(u||'')?u:'',
lnk=(u,t)=>url(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t||u.replace(/^https?:\/\//,''))}</a>`:'—';
let db,view='dash',sel='',q='',cb=null;
const KEY='miraPanel_v1';
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};

/* ===== Demo veri ===== */
function demo(){
  const n=new Date(),ym=k=>{const d=new Date(n.getFullYear(),n.getMonth()-k,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)},
  D=(k,day=1)=>ym(k)+'-'+p2(day),
  base={site:'https://example.com',panel:'https://example.com/admin',pass:'demo1234',plan:'https://drive.google.com'};
  const customers=[
    {...base,id:'d1',name:'Atlas Mobilya',person:'Ayşe Yılmaz',phone:'0532 111 22 33',email:'ayse@atlas.example',fee:1500,start:ym(6)},
    {...base,id:'d2',name:'Deniz Diş Kliniği',person:'Dr. Deniz Kara',phone:'0533 222 33 44',email:'info@deniz.example',fee:2250,start:ym(4)},
    {...base,id:'d3',name:'Lezzet Durağı',person:'Mehmet Demir',phone:'0534 333 44 55',email:'mehmet@lezzet.example',fee:1250,start:ym(3)}];

/* ===== Otomatik alacak üretimi: her ayın son 3 gününde YENİ AY aidatı borçlanır, ödeme günü yeni ayın 1'i ===== */
const ws=ym=>{const[y,m]=ym.split('-').map(Number),py=m==1?y-1:y,pm=m==1?12:m-1;return iso(py,pm,new Date(py,pm,0).getDate()-2)};
function sync(){
  const t=today();
  db.charges.forEach(x=>{if(/^\d{4}-\d{2}$/.test(x.ym)){x.due=x.ym+'-01';x.date=ws(x.ym)}});
  db.customers.forEach(c=>{
    let[y,m]=c.start.split('-').map(Number);
    for(;;){
      const ym=y+'-'+p2(m),d=ws(ym);
      if(d>t)break;
      if(!(c.skip||[]).includes(ym)&&!db.charges.some(x=>x.cid==c.id&&x.ym==ym))
        db.charges.push({id:uid(),cid:c.id,ym,date:d,due:ym+'-01',amount:c.fee,desc:`${MON[m-1]} ${y} Aidatı`});
      if(++m>12){m=1;y++}
    }
  });
  save()
}

/* ===== Cari hesaplama (ödemeler en eski aidattan başlayarak eşleşir) ===== */
function acct(cid){
  const by=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0,
  ch=db.charges.filter(x=>x.cid==cid).sort(by),
  pays=db.payments.filter(x=>x.cid==cid).sort(by),
  months=ch.map(x=>({...x,paid:0,last:null,exp:x.due||nextDay(x.date)})),t=today();
  const res={},pool=[],
  put=(m,amt,date)=>{const u=Math.max(Math.min(m.amount-m.paid,amt),0);if(u>0){m.paid+=u;if(!m.last||date>m.last)m.last=date}return amt-u};
  /* 1) belirli bir ay için yapılan ödemeler: alacak varsa düşer, henüz oluşmadıysa o ay için ayrılır */
  pays.forEach(p=>{
    if(!p.for){pool.push({amt:p.amount,date:p.date});return}
    const m=months.find(x=>x.ym==p.for);
    if(m){const left=put(m,p.amount,p.date);if(left>.005)pool.push({amt:left,date:p.date})}
    else(res[p.for]=res[p.for]||[]).push({amt:p.amount,date:p.date});
  });
  /* 2) genel ödemeler ve artanlar en eski borçtan başlayarak düşer */
  pool.forEach(x=>{let r=x.amt;for(const m of months){if(r<=.005)break;r=put(m,r,x.date)}});
  months.forEach(m=>{
    m.rem=Math.max(m.amount-m.paid,0);m.full=m.rem<.005;
    m.delay=m.full?dd(m.exp,m.last):(t>m.exp?dd(m.exp,t):0);
    m.st=m.full?(m.delay<=0?[m.last.slice(0,7)<m.exp.slice(0,7)?'Peşin ödendi':'Zamanında Ödendi','ok']:[`${m.delay} gün gecikmeli ödendi`,'late'])
      :m.paid>0?['Kısmi Ödeme'+(m.delay>0?` – ${m.delay} gün gecikmede`:''),'part']
      :m.delay>0?[`Ödenmedi – ${m.delay} gün gecikmede`,'bad']:['Vade bekleniyor','wait'];
  });
  const tot=ch.reduce((s,x)=>s+x.amount,0),paid=pays.reduce((s,x)=>s+x.amount,0),
  due=months.filter(m=>m.full||m.delay>0),
  avg=due.length?due.reduce((s,m)=>s+Math.max(m.delay,0),0)/due.length:0,
  rate=due.length?due.filter(m=>m.full&&m.delay<=0).length/due.length*100:100;
  return{months,res,tot,paid,rem:months.reduce((s,m)=>s+m.rem,0),adv:Math.max(paid-months.reduce((s,m)=>s+m.paid,0),0),avg,rate,
    late:months.filter(m=>m.delay>0).reduce((s,m)=>s+m.rem,0),
    fullN:months.filter(m=>m.full).length,
    score:rate>=90?'A':rate>=70?'B':rate>=50?'C':'D'}
}

function line(vals,labels){
  const W=600,H=140,mx=Math.max(5,...vals),st=vals.length>1?(W-40)/(vals.length-1):0,
  pts=vals.map((v,i)=>[20+i*st,H-v/mx*(H-10)]);

  pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#A78BFA" stroke="#6D28D9" stroke-width="2"><title>${labels[i]}: ${vals[i]} gün</title></circle><text x="${p[0]}" y="${H+22}" text-anchor="middle" font-size="11" fill="#6B6280">${labels[i].split(' ')[0].slice(0,3)}</text>`).join('')+`</svg>`

$('#f').onsubmit=e=>{e.preventDefault();const r=cb(Object.fromEntries(new FormData($('#f'))));if(r)$('#err').textContent=r;else{dlg.close();sync();render()}};

const payF=o=>[{k:'for',l:'Hangi ayın aidatı için?',v:o.for,t:'select',o:[['','Genel ödeme (en eski borçtan düşer)'],...mopts(o.for,36,24)]},
  {k:'date',l:'Ödemenin yapıldığı ay (gün otomatik kaydedilir)',v:o.date,t:'select',o:mopts(o.date,60,0),r:1},
  {k:'amount',l:'Tutar (₺)',v:o.amount,t:'number',r:1},{k:'note',l:'Not',v:o.note}];
const saveP=id=>v=>{
  const a=parseFloat(v.amount);if(!(a>0))return'Tutar 0’dan büyük olmalıdır.';
  const o={amount:a,note:v.note.trim(),for:v.for||''};
  if(id){const p=db.payments.find(x=>x.id==id);Object.assign(p,o,{date:v.date==p.date.slice(0,7)?p.date:pdate(v.date)})}
  else db.payments.push({id:uid(),cid:sel,date:pdate(v.date),...o});
  return null};
const CF=c=>[{k:'name',l:'Firma adı',v:c.name,r:1},{k:'site',l:'Web sitesi',v:c.site,t:'url'},{k:'panel',l:'Yönetim panel linki',v:c.panel,t:'url'},{k:'pass',l:'Şifre',v:c.pass},{k:'plan',l:'Yönetim planı (Drive linki)',v:c.plan,t:'url'},{k:'person',l:'Yetkili adı',v:c.person},{k:'phone',l:'Telefon',v:c.phone,t:'tel'},{k:'email',l:'E-posta',v:c.email,t:'email'},{k:'fee',l:'Aylık aidat (₺)',v:c.fee,t:'number',r:1},{k:'start',l:'Aidat başlangıç ayı',v:c.start,t:'select',o:mopts(c.start,60,24),r:1}];
function saveC(id){return v=>{
  if(!v.name.trim())return'Firma adı zorunludur.';
  const fee=parseFloat(v.fee);if(!(fee>0))return'Aylık aidat 0’dan büyük olmalıdır.';
  if(!v.start)return'Başlangıç ayını seçin.';
  ['site','panel','plan'].forEach(k=>{if(v[k]&&!/^https?:\/\//i.test(v[k]))v[k]='https://'+v[k]});
  const o={...v,name:v.name.trim(),fee};
  if(id)Object.assign(db.customers.find(c=>c.id==id),o);else db.customers.push({id:uid(),...o});
  return null}}

/* ===== Eylemler ===== */
const A={
 go:id=>{view=id;render();scrollTo(0,0)},
 'add-c':()=>openForm('Müşteri Ekle',CF({start:today().slice(0,7)}),saveC()),
 'edit-c':id=>openForm('Müşteriyi Düzenle',CF(db.customers.find(c=>c.id==id)),saveC(id)),
 'del-c':id=>ask('Bu müşteri ve tüm alacak/ödeme kayıtları silinecek.',()=>{db.customers=db.customers.filter(c=>c.id!=id);db.charges=db.charges.filter(x=>x.cid!=id);db.payments=db.payments.filter(x=>x.cid!=id);save();render()}),
 eye:id=>{const s=$('#pw'+id),c=db.customers.find(c=>c.id==id);s.textContent=s.textContent=='●●●●●●'?(c.pass||'—'):'●●●●●●'},
 copy:id=>{navigator.clipboard?.writeText(db.customers.find(c=>c.id==id).pass||'').then(()=>toast('Şifre kopyalandı'))},
 'add-p':()=>{
  const c=db.customers.find(x=>x.id==sel),a=acct(sel);let[y,m]=c.start.split('-').map(Number),def='';
  for(let i=0;i<120;i++){const ym=y+'-'+p2(m),mo=a.months.find(x=>x.ym==ym),cov=(mo?mo.paid:0)+(a.res[ym]||[]).reduce((s,r)=>s+r.amt,0);if(cov+.005<c.fee){def=ym;break}if(++m>12){m=1;y++}}
  openForm('Ödeme Ekle',payF({for:def,date:today().slice(0,7),amount:c.fee,note:''}),saveP())},
 'edit-p':id=>{const p=db.payments.find(x=>x.id==id);openForm('Ödemeyi Düzenle',payF({for:p.for||'',date:p.date.slice(0,7),amount:p.amount,note:p.note}),saveP(id))},
 'del-p':id=>ask('Bu ödeme kaydı silinecek.',()=>{db.payments=db.payments.filter(x=>x.id!=id);save();render()}),
 'edit-ch':id=>{const x=db.charges.find(x=>x.id==id);openForm('Alacağı Düzenle',[{k:'desc',l:'Açıklama',v:x.desc,r:1},{k:'amount',l:'Tutar (₺)',v:x.amount,t:'number',r:1}],v=>{const a=parseFloat(v.amount);if(!(a>0))return'Tutar 0’dan büyük olmalıdır.';Object.assign(x,{desc:v.desc,amount:a});return null})},
 'del-ch':id=>ask('Bu alacak kaydı silinecek ve aynı ay için yeniden oluşturulmayacak.',()=>{const x=db.charges.find(x=>x.id==id),c=db.customers.find(c=>c.id==x.cid);(c.skip=c.skip||[]).push(x.ym);db.charges=db.charges.filter(y=>y.id!=id);save();render()}),
 print:()=>print()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id)});
$('#q').onchange=e=>{q=e.target.value;if(q)sel=q;render()};
addEventListener('beforeprint',()=>document.querySelectorAll('details.mm').forEach(d=>d.open=true));
load();render();
</script>
</body>
</html>
